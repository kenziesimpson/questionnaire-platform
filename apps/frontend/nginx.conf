# Serves the built SPA and reverse-proxies /api to the backend, keeping the
# browser single-origin (no CORS, no build-time API URL). Stand-in for the
# ingress/load-balancer routing a production deployment does instead — see
# docs/2-design-doc.md §13.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: client-side routing resolves any unmatched path to index.html.
    location / {
        try_files $uri /index.html;
    }
}
