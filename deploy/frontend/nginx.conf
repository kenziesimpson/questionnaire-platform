map $request_uri $request_path {
    default "";
    "~^(?<uri_path>[^?]*)" $uri_path;
}

map $request_path $logged_route {
    default $request_path;
    "~^/api/run/sessions/[^/]+$" /api/run/sessions/:sessionId;
    "~^/api/run/sessions/[^/]+(?<run_suffix>/.*)$" "/api/run/sessions/:sessionId$run_suffix";
    "~^(?<reporting_prefix>/api/reporting/questionnaires/[^/]+/responses/)[^/]+(?<reporting_suffix>(?:/.*)?)$" "${reporting_prefix}:sessionId$reporting_suffix";
    "~^(?<admin_prefix>/admin/questionnaires/[^/]+/responses/)[^/]+(?<admin_suffix>(?:/.*)?)$" "${admin_prefix}:sessionId$admin_suffix";
}

map $http_traceparent $logged_trace_id {
    default "";
    "~^00-(?!0{32}-)(?<traceparent_trace>[0-9a-f]{32})-(?!0{16}-)[0-9a-f]{16}-[0-9a-f]{2}$" $traceparent_trace;
}

map $http_traceparent $logged_span_id {
    default "";
    "~^00-(?!0{32}-)[0-9a-f]{32}-(?!0{16}-)(?<traceparent_span>[0-9a-f]{16})-[0-9a-f]{2}$" $traceparent_span;
}

log_format telemetry escape=json
    '{"msg":"request completed",'
    '"http.request.method":"$request_method",'
    '"http.route":"$logged_route",'
    '"http.response.status_code":$status,'
    '"trace_id":"$logged_trace_id",'
    '"span_id":"$logged_span_id"}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    access_log /var/log/nginx/access.log telemetry;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri /index.html;
    }
}
