map $request_uri $request_path {
    default "";
    "~^(?<uri_path>[^?]*)" $uri_path;
}

map $request_path $masked_route {
    default $request_path;
    "~^/api/run/sessions/[^/]+/?$" /api/run/sessions/:sessionId;
    "~^/api/run/sessions/[^/]+/submit/?$" /api/run/sessions/:sessionId/submit;
    "~^/api/run/sessions/" ":unmatched";
    "~^(?<reporting_prefix>/api/reporting/questionnaires/[^/]+/responses/)[^/]+/?$" "${reporting_prefix}:sessionId";
    "~^/api/reporting/questionnaires/[^/]+/responses/" ":unmatched";
    "~^(?<admin_prefix>/admin/questionnaires/[^/]+/responses/)[^/]+/?$" "${admin_prefix}:sessionId";
    "~^/admin/questionnaires/[^/]+/responses/" ":unmatched";
}

map $masked_route $logged_route {
    default ":unmatched";
    "~^(?:/|(?:/:?[A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]+)*)+/?)$" $masked_route;
}

map $status $logged_status {
    default $status;
    "000" 0;
}

map $http_traceparent $logged_trace_id {
    default "";
    "~^00-(?!0{32}-)(?<traceparent_trace>[0-9a-f]{32})-(?!0{16}-)[0-9a-f]{16}-[0-9a-f]{2}$" $traceparent_trace;
}

map $http_traceparent $logged_span_id {
    default "";
    "~^00-(?!0{32}-)[0-9a-f]{32}-(?!0{16}-)(?<traceparent_span>[0-9a-f]{16})-[0-9a-f]{2}$" $traceparent_span;
}

limit_req_zone $binary_remote_addr zone=telemetry_ingest:10m rate=360r/m;

log_format telemetry escape=json
    '{"msg":"request completed",'
    '"http.request.method":"$request_method",'
    '"http.route":"$logged_route",'
    '"http.response.status_code":$logged_status,'
    '"trace_id":"$logged_trace_id",'
    '"span_id":"$logged_span_id"}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    access_log /var/log/nginx/access.log telemetry;

    location ~ ^/api/telemetry/?$ {
        limit_req zone=telemetry_ingest burst=60 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri /index.html;
    }
}
