services:
  backend:
    build:
      target: deps
    command: ["sh", "-c", "npm run dev -w packages/shared & npm run dev -w apps/backend"]
    environment:
      NODE_ENV: development
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./packages/shared:/app/packages/shared
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      target: deps
    command: ["sh", "-c", "npm run dev -w packages/shared & npm run dev -w apps/frontend -- --host"]
    environment:
      VITE_API_PROXY_TARGET: http://backend:3000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./packages/shared:/app/packages/shared
    depends_on:
      - backend
