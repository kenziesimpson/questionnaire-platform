<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:oklch(1 0 0);--fg:oklch(0.145 0 0);--muted:oklch(0.97 0 0);--mfg:oklch(0.556 0 0);
      --border:oklch(0.922 0 0);--primary:oklch(0.205 0 0);--pfg:oklch(0.985 0 0);
      --ring:oklch(0.708 0 0);
    }
    body{margin:0;background:var(--bg);color:var(--fg);
      font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      -webkit-font-smoothing:antialiased;}
    a{color:oklch(0.205 0 0);text-underline-offset:4px;}
    a:hover{color:oklch(0.145 0 0);}
  </style>
</helmet>

<div style="display: flex; flex-direction: column; gap: 32px; padding: 72px 80px 64px; width: 560px; margin: 0 auto">

  <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 999px; background: var(--muted)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.556 0 0)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m15 9-6 6"></path><path d="m9 9 6 6"></path></svg>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-size: 30px; line-height: 1.2; font-weight: 600; letter-spacing: -0.015em">Patient Intake is closed</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.6; color: var(--mfg)">This questionnaire stopped accepting responses on 31 August 2026. Answers already submitted are unaffected.</p>
  </div>

  <p style="margin: 0; font-size: 14px; line-height: 1.6; color: var(--mfg)">If your clinic sent you this link, ask them for a current one.</p>

</div>
</x-dc>
</body>
</html>
