<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:oklch(1 0 0);--fg:oklch(0.145 0 0);--muted:oklch(0.97 0 0);--mfg:oklch(0.556 0 0);
      --border:oklch(0.922 0 0);--primary:oklch(0.205 0 0);--pfg:oklch(0.985 0 0);
      --ring:oklch(0.708 0 0);
    }
    body{margin:0;background:var(--bg);color:var(--fg);
      font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      -webkit-font-smoothing:antialiased;}
    a{color:oklch(0.205 0 0);text-underline-offset:4px;}
    a:hover{color:oklch(0.145 0 0);}
    .opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border:1px solid var(--border);border-radius:10px;font-size:16px;}
    .dot{display:block;width:18px;height:18px;border:1px solid var(--border);border-radius:999px;flex-shrink:0;}
    .on{border-color:var(--primary);background:var(--muted);font-weight:500;}
    .ondot{display:flex;align-items:center;justify-content:center;width:18px;height:18px;border:1px solid var(--primary);border-radius:999px;background:var(--primary);flex-shrink:0;}
    .pip{display:block;width:7px;height:7px;border-radius:999px;background:var(--pfg);}
    .q{font-size:16px;line-height:1.4;font-weight:500;padding:0;}
    .hint{font-size:13px;line-height:1.35;color:var(--mfg);}
    .in{height:44px;padding:0 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px;outline:none;}
  </style>
</helmet>

<div style="display: flex; flex-direction: column; gap: 22px; padding: 28px 20px 24px; width: 390px; box-sizing: border-box">

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -0.015em">Patient Intake</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.45; color: var(--mfg)">All questions are required. Your answers are saved on this device as you go.</p>
  </div>

  <fieldset style="display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; border: 0">
    <legend class="q">Do you have a medical condition?</legend>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label class="opt on"><span class="ondot"><span class="pip"></span></span>Yes</label>
      <label class="opt"><span class="dot"></span>No</label>
    </div>
  </fieldset>

  <fieldset style="display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; border: 0">
    <legend class="q">Which condition?</legend>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label class="opt"><span class="dot"></span>Diabetes</label>
      <label class="opt on"><span class="ondot"><span class="pip"></span></span><span style="line-height: 1.3">High blood pressure (hypertension)</span></label>
      <label class="opt" style="padding-right: 10px"><span class="dot"></span><input type="text" placeholder="Other" style="flex-grow: 1; min-width: 0; height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; font-size: 15px; outline: none"></label>
    </div>
  </fieldset>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <label class="q">When were you diagnosed?</label>
    <input class="in" type="date" value="2019-04-08">
    <span class="hint">Cannot be in the future.</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <label class="q">Preferred pharmacy</label>
    <input class="in" type="text" value="Boots, Byres Road">
  </div>

  <button style="height: 48px; border: 1px solid transparent; border-radius: 10px; background: var(--primary); color: var(--pfg); font: inherit; font-size: 16px; font-weight: 500; cursor: pointer">Submit answers</button>

</div>
</x-dc>
</body>
</html>
