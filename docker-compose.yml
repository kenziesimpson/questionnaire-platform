x-qp-db-env: &qp-db-env
  POSTGRES_USER: ${POSTGRES_USER:-questionnaire}
  POSTGRES_DB: ${POSTGRES_DB:-questionnaire_platform}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_parameter_max_length=0
      - -c
      - log_error_verbosity=terse
    environment:
      <<: *qp-db-env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-questionnaire}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-questionnaire} -d ${POSTGRES_DB:-questionnaire_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  roles:
    image: postgres:16-alpine
    command: ["sh", "/qp-init/01-roles.sh"]
    environment:
      <<: *qp-db-env
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD:-questionnaire}
      QP_OWNER_PASSWORD: ${QP_OWNER_PASSWORD:-qp_owner}
      QP_DEFINITION_PASSWORD: ${QP_DEFINITION_PASSWORD:-qp_definition}
      QP_EXECUTION_PASSWORD: ${QP_EXECUTION_PASSWORD:-qp_execution}
      QP_REPORTING_PASSWORD: ${QP_REPORTING_PASSWORD:-qp_reporting}
      QP_MONITOR_PASSWORD: ${QP_MONITOR_PASSWORD:-qp_monitor}
    volumes:
      - ./db/init:/qp-init:ro
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["sh", "-c", "node apps/backend/dist/db/migrate.js && node apps/backend/dist/db/seed/seed.js"]
    environment:
      DATABASE_URL_OWNER: postgres://qp_owner:${QP_OWNER_PASSWORD:-qp_owner}@db:5432/${POSTGRES_DB:-questionnaire_platform}
      DATABASE_URL_DEFINITION: postgres://qp_definition:${QP_DEFINITION_PASSWORD:-qp_definition}@db:5432/${POSTGRES_DB:-questionnaire_platform}
    depends_on:
      roles:
        condition: service_completed_successfully

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL_DEFINITION: postgres://qp_definition:${QP_DEFINITION_PASSWORD:-qp_definition}@db:5432/${POSTGRES_DB:-questionnaire_platform}
      DATABASE_URL_EXECUTION: postgres://qp_execution:${QP_EXECUTION_PASSWORD:-qp_execution}@db:5432/${POSTGRES_DB:-questionnaire_platform}
      DATABASE_URL_REPORTING: postgres://qp_reporting:${QP_REPORTING_PASSWORD:-qp_reporting}@db:5432/${POSTGRES_DB:-questionnaire_platform}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready', { signal: AbortSignal.timeout(4000) }).then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

  collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol/collector.yaml"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-questionnaire_platform}
      QP_MONITOR_PASSWORD: ${QP_MONITOR_PASSWORD:-qp_monitor}
      QP_SERVICE_VERSION: ${QP_SERVICE_VERSION:-dev}
      QP_TRACE_SAMPLE_PERCENT: ${QP_TRACE_SAMPLE_PERCENT:-100}
      QP_TRACE_SLOW_MS: ${QP_TRACE_SLOW_MS:-1000}
    ports:
      - "127.0.0.1:${OTLP_PORT:-4318}:4318"
    volumes:
      - ./observability/collector.yaml:/etc/otelcol/collector.yaml:ro
    depends_on:
      roles:
        condition: service_completed_successfully
      lgtm:
        condition: service_started

  lgtm:
    profiles: ["observability"]
    image: grafana/otel-lgtm:0.33.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"

volumes:
  db-data:
