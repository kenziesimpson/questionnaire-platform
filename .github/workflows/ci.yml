name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # Fall back to running full CI if we can't safely diff (e.g. force
          # push, new branch, or shallow history missing the base commit).
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          if [ -z "$CHANGED" ] || echo "$CHANGED" | grep -qv '\.md$'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Checks
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: needs.changes.outputs.docs_only != 'true'

      - uses: actions/cache@v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('package-lock.json', 'eslint.config.mjs', '**/tsconfig*.json') }}
          restore-keys: |
            eslint-

      - run: npm run lint
        if: needs.changes.outputs.docs_only != 'true'

      - run: npm run typecheck
        if: needs.changes.outputs.docs_only != 'true'

      - run: npm test
        if: needs.changes.outputs.docs_only != 'true'

      - run: npm run build
        if: needs.changes.outputs.docs_only != 'true'

      - name: Docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Only Markdown files changed — skipping install/lint/typecheck/test/build."

  e2e:
    name: End-to-end
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_RUN_ID: ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: needs.changes.outputs.docs_only != 'true'

      - run: npx playwright install --with-deps chromium
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: e2e

      - run: npm run test:e2e
        if: needs.changes.outputs.docs_only != 'true'

      - if: needs.changes.outputs.docs_only != 'true' && failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

      - name: Docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Only Markdown files changed — skipping the Playwright suite."
